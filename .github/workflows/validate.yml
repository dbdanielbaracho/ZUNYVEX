name: Validate Roblox build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require complete production entrypoints
        run: |
          missing=0
          for file in src/StarterPlayer/StarterPlayerScripts/Building.client.luau src/ServerScriptService/Building.server.luau src/ServerScriptService/Zunyvex.server.luau; do
            if ! test -s "$file"; then
              echo "::error file=$file::Missing or empty production entrypoint"
              missing=1
            fi
          done
          exit "$missing"
      - name: Build pinned Luau compiler
        run: |
          git clone --depth 1 --branch 0.656 https://github.com/luau-lang/luau.git "$RUNNER_TEMP/luau"
          test "$(git -C "$RUNNER_TEMP/luau" rev-parse HEAD)" = c759cd5581f570980cf05186b0db58e65371c9fb
          cmake -S "$RUNNER_TEMP/luau" -B "$RUNNER_TEMP/luau-build" -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build "$RUNNER_TEMP/luau-build" --target Luau.Compile.CLI Luau.Repl.CLI -j 2
      - name: Compile all Luau sources
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            echo "Compiling $file"
            "$RUNNER_TEMP/luau-build/luau-compile" "$file" > /dev/null
            count=$((count+1))
          done < <(find src tests -type f -name '*.luau' -print0)
          test "$count" -ge 11
          echo "Compiled $count Luau files"
      - name: Execute checkpoint race functional tests
        run: |
          "$RUNNER_TEMP/luau-build/luau" tests/CheckpointRace.spec.luau
      - name: Execute creative build codec tests
        run: |
          "$RUNNER_TEMP/luau-build/luau" tests/BuildPersistenceCLI.spec.luau
      - name: Execute building ownership tests
        run: |
          "$RUNNER_TEMP/luau-build/luau" tests/BuildLedger.spec.luau
      - name: Execute cloud adventure tests
        run: |
          "$RUNNER_TEMP/luau-build/luau" tests/CloudChallenge.spec.luau
      - name: Execute discovery reward tests
        run: |
          "$RUNNER_TEMP/luau-build/luau" tests/DiscoveryLedger.spec.luau
      - name: Execute color trail tests
        run: |
          "$RUNNER_TEMP/luau-build/luau" tests/ColorTrail.spec.luau
      - name: Execute trail ranking tests
        run: |
          "$RUNNER_TEMP/luau-build/luau" tests/TrailRanking.spec.luau
      - name: Execute relic expedition tests
        run: |
          "$RUNNER_TEMP/luau-build/luau" tests/Expedition.spec.luau
      - name: Execute contact guard tests
        run: |
          "$RUNNER_TEMP/luau-build/luau" tests/ContactGuard.spec.luau
      - name: Execute memory challenge tests
        run: |
          "$RUNNER_TEMP/luau-build/luau" tests/MemoryMatch.spec.luau
      - name: Install Rojo
        run: cargo install rojo --version 7.4.4 --locked
      - name: Build private place artifact
        run: rojo build default.project.json -o ZUNYVEX.rbxlx
      - name: Check artifact
        run: test -s ZUNYVEX.rbxlx
      - uses: actions/upload-artifact@v4
        with:
          name: ZUNYVEX-private-build
          path: ZUNYVEX.rbxlx
          if-no-files-found: error
