name: Validate Roblox build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require complete production entrypoints
        run: |
          missing=0
          for file in src/StarterPlayer/StarterPlayerScripts/Building.client.luau src/ServerScriptService/Building.server.luau src/ServerScriptService/Zunyvex.server.luau; do
            if ! test -s "$file"; then
              echo "::error file=$file::Missing or empty production entrypoint"
              missing=1
            fi
          done
          exit "$missing"
      - name: Install Rojo
        run: cargo install rojo --version 7.4.4 --locked
      - name: Build private place artifact
        run: rojo build default.project.json -o ZUNYVEX.rbxlx
      - name: Check artifact
        run: test -s ZUNYVEX.rbxlx
      - uses: actions/upload-artifact@v4
        with:
          name: ZUNYVEX-private-build
          path: ZUNYVEX.rbxlx
          if-no-files-found: error
