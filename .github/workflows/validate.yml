name: Validate Roblox build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rojo
        run: cargo install rojo --version 7.4.4 --locked
      - name: Build private place artifact
        run: rojo build default.project.json -o ZUNYVEX.rbxlx
      - name: Check artifact
        run: test -s ZUNYVEX.rbxlx
      - uses: actions/upload-artifact@v4
        with:
          name: ZUNYVEX-private-build
          path: ZUNYVEX.rbxlx
          if-no-files-found: error
